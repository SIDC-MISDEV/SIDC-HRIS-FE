<div class="content-wrapper container-xxl p-0">
  <div class="content-body">
    <app-content-header [contentHeader]="contentHeader"></app-content-header>

    <section id="payroll-approval-page">
      <div class="d-flex mt-1 mb-1 justify-content-between">
        <div class="col-6 ml-1 align-items-center d-flex">
          <h4 style="margin: 0">Payroll Summary List</h4>
        </div>
        <div class="col-6 mr-1 d-flex align-items-center justify-content-end">
          <label class="mr-1 mb-0">Payroll Group:</label>
          <select
            #selectPayrollGroup
            [(ngModel)]="payrollGroup"
            id="payrollGroup"
            name="payrollGroup"
            class="form-control"
            style="width: auto"
            (change)="onPayrollGroupChange()"
          >
            <option value="sofos2_payroll">Rank and File</option>
            <option value="sofos2_payroll_manager">Upper Strata</option>
          </select>
        </div>
      </div>

      
      <div class="card">
        <ngx-datatable
          #table
          class="bootstrap core-bootstrap"
          [columnMode]="ColumnMode.flex"
          [headerHeight]="40"
          [rowHeight]="58"
          [footerHeight]="50"
          [rows]="rows"
          rowHeight="auto"
          [scrollbarH]="true"
          [externalPaging]="true"
          [count]="page.totalCount"
          [offset]="page.pageNumber"
          [limit]="page.size"
          (page)="setPage($event)"
        >
          <ngx-datatable-column
            prop="payrollId"
            name="Payroll ID"
            [flexGrow]="1"
            [sortable]="false"
          ></ngx-datatable-column>
          <ngx-datatable-column
            prop="payPeriod"
            name="Payroll Period"
            [flexGrow]="2.5"
            [sortable]="false"
          ></ngx-datatable-column>
          <ngx-datatable-column
            prop="grossPay"
            name="Total Gross Pay"
            [flexGrow]="1.5"
            [sortable]="false"
            headerClass="align-right"
            cellClass="align-right"
          >
            <ng-template ngx-datatable-cell-template let-row="row">
              {{ row.grossPay | currency:'PHP ' }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column
            prop="totalDeduction"
            name="Total Deduction"
            [flexGrow]="1.5"
            [sortable]="false"
            headerClass="align-right"
            cellClass="align-right"
          >
            <ng-template ngx-datatable-cell-template let-row="row">
              {{ row.totalDeduction | currency:'PHP ' }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column
            prop="netPay"
            name="Total Net Pay"
            [flexGrow]="1.5"
            [sortable]="false"
            headerClass="align-right"
            cellClass="align-right"
          >
            <ng-template ngx-datatable-cell-template let-row="row">
              {{ row.netPay | currency:'PHP ' }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column
            prop="status"
            name="Status"
            [flexGrow]="1"
            [sortable]="false"
            headerClass="align-center"
            cellClass="align-center"
          >
            <ng-template ngx-datatable-cell-template let-row="row">
              <span class="badge badge-pill status-badge" [ngClass]="statusBadgeClass(row.status)">{{ row.status }}</span>
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column
            name="Actions"
            [flexGrow]="0.8"
            [sortable]="false"
            headerClass="align-center"
            cellClass="align-center"
          >
            <ng-template ngx-datatable-cell-template let-row="row">
              <span
                data-feather="eye"
                [size]="18"
                class="cursor-pointer"
                style="color: #000"
                (click)="view(row)"
                ngbTooltip="View"
              ></span>
            </ng-template>
          </ngx-datatable-column>
        </ngx-datatable>
      </div>
    </section>
  </div>
</div>
