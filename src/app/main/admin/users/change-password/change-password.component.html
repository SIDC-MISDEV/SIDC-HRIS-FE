<div class="content-wrapper container-xxl p-0">
  <div class="content-body">
    <app-content-header [contentHeader]="contentHeader"></app-content-header>

    <section id="change-password">
      <div class="card change-password-card">
        <div class="row no-gutters">

          <!-- Form -->
          <div class="col-12 col-md-6">
            <div class="card-body">
              <h4 class="card-title mb-0">Update your password</h4>
              <p class="text-muted mb-2">Use a strong password you don't use anywhere else.</p>

              <form class="auth-reset-pass-form" [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" novalidate>

                <!-- Current password -->
                <div class="form-group">
                  <label for="currentPassword">Current Password</label>
                  <div class="input-group input-group-merge form-password-toggle">
                    <input
                      [type]="isOldPasswordHidden ? 'password' : 'text'"
                      class="form-control form-control-merge"
                      id="currentPassword"
                      formControlName="currentPassword"
                      tabindex="1"
                      autocomplete="current-password"
                      [ngClass]="{ 'is-invalid error': submitted && f.currentPassword.errors }"
                    />
                    <div class="input-group-append">
                      <span class="input-group-text cursor-pointer" (click)="hideUnhideOldPassword()">
                        <i class="feather font-small-4"
                           [ngClass]="{ 'icon-eye-off': !isOldPasswordHidden, 'icon-eye': isOldPasswordHidden }"></i>
                      </span>
                    </div>
                  </div>
                  <div *ngIf="submitted && f.currentPassword.errors" class="invalid-feedback d-block">
                    <div *ngIf="f.currentPassword.errors.required">Current password is required</div>
                  </div>
                </div>

                <!-- New password -->
                <div class="form-group">
                  <label for="password">New Password</label>
                  <div class="input-group input-group-merge form-password-toggle">
                    <input
                      [type]="isNewPasswordHidden ? 'password' : 'text'"
                      class="form-control form-control-merge"
                      id="password"
                      formControlName="password"
                      tabindex="2"
                      autocomplete="new-password"
                      [ngClass]="{ 'is-invalid error': submitted && (f.password.errors || sameAsCurrent) }"
                    />
                    <div class="input-group-append">
                      <span class="input-group-text cursor-pointer" (click)="hideUnhideNewPassword()">
                        <i class="feather font-small-4"
                           [ngClass]="{ 'icon-eye-off': !isNewPasswordHidden, 'icon-eye': isNewPasswordHidden }"></i>
                      </span>
                    </div>
                  </div>
                  <div *ngIf="submitted && f.password.errors?.required" class="invalid-feedback d-block">
                    New password is required
                  </div>
                  <div *ngIf="sameAsCurrent && (submitted || f.password.dirty)" class="invalid-feedback d-block">
                    New password must be different from your current password
                  </div>
                </div>

                <!-- Confirm password -->
                <div class="form-group">
                  <label for="confirmPassword">Confirm Password</label>
                  <div class="input-group input-group-merge form-password-toggle">
                    <input
                      [type]="isConfirmPasswordHidden ? 'password' : 'text'"
                      class="form-control form-control-merge"
                      id="confirmPassword"
                      formControlName="confirmPassword"
                      tabindex="3"
                      autocomplete="new-password"
                      [ngClass]="{ 'is-invalid error': submitted && f.confirmPassword.errors }"
                    />
                    <div class="input-group-append">
                      <span class="input-group-text cursor-pointer" (click)="hideUnhideConfirmPassword()">
                        <i class="feather font-small-4"
                           [ngClass]="{ 'icon-eye-off': !isConfirmPasswordHidden, 'icon-eye': isConfirmPasswordHidden }"></i>
                      </span>
                    </div>
                  </div>
                  <div *ngIf="submitted && f.confirmPassword.errors" class="invalid-feedback d-block">
                    <div *ngIf="f.confirmPassword.errors.required">Confirm password is required</div>
                    <div *ngIf="f.confirmPassword.errors.mustMatch">Passwords did not match</div>
                  </div>
                </div>

                <!-- Actions -->
                <div class="form-actions">
                  <button type="button" class="btn btn-outline-secondary" routerLink="/settings" rippleEffect>
                    Cancel
                  </button>
                  <button type="submit" class="btn btn-primary" tabindex="4" [disabled]="loading" rippleEffect>
                    <span *ngIf="loading" class="spinner-border spinner-border-sm mr-50"></span>
                    Change Password
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- Requirements -->
          <div class="col-12 col-md-6 requirements-col">
            <div class="card-body">
              <h6 class="mb-1">Password requirements</h6>
              <ul class="requirements-list">
                <li
                  *ngFor="let rule of rules"
                  class="password-requirement"
                  [class.password-invalid]="showRuleState() && ruleFailed(rule.key)"
                  [class.password-valid]="showRuleState() && !ruleFailed(rule.key)"
                >
                  <i class="feather requirement-icon"
                     [ngClass]="showRuleState() && !ruleFailed(rule.key) ? 'icon-check-circle' : 'icon-circle'"></i>
                  {{ rule.label }}
                </li>
              </ul>
            </div>
          </div>

        </div>
      </div>
    </section>
  </div>
</div>
