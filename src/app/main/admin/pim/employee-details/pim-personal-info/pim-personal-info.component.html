<hr class="custom-hr" />

<form class="form" #pimPersonalDetailsForm="ngForm">
  <div class="row justify-content-start d-flex align-items-center">
    <div class="form-group col-4">
      <label class="form-label" for="departmentId">First Name *</label>
      <input name="departmentId" type="text" class="form-control" />
    </div>
    <div class="form-group col-4">
      <label class="form-label" for="departmentId">Middle Name</label>
      <input name="departmentId" type="text" class="form-control" />
    </div>
    <div class="form-group col-4">
      <label class="form-label" for="departmentId">Last Name *</label>
      <input name="departmentId" type="text" class="form-control" />
    </div>
  </div>
  <div class="row d-flex justify-content-start align-items-center">
    <div class="form-group col-4">
      <label class="form-label" for="departmentId">Suffix Name</label>
      <select
        name="departmentId"
        type="text"
        class="form-control"
      >
        <option>Option 1</option>
        <option>Option 2</option>
        <option>Option 3</option>
      </select>
    </div>
    <div class="form-group col-4">
      <label class="form-label" for="departmentId">Gender</label>
      <select
        name="departmentId"
        type="text"
        class="form-control"
      >
        <option>Male</option>
        <option>Female</option>
      </select>
    </div>
    <div class="form-group col-4">
      <label class="form-label" for="departmentId">Civil Status</label>
      <select
        name="departmentId"
        type="text"
        class="form-control"
      >
        <option>Single</option>
        <option>Option 2</option>
        <option>Option 3</option>
      </select>
    </div>
  </div>
  <div class="row justify-content-start d-flex align-items-center">
    <div class="form-group col-4">
      <label class="form-label" for="departmentId">Birth Date</label>
      <input
        name="departmentId"
        type="text"
        value="1998/02/14"
        class="form-control"
      />
    </div>
  </div>
  <hr class="custom-hr" />
  <div class="row d-flex justify-content-start align-items-center">
    <div class="form-group col-4">
      <label class="form-label" for="departmentId">Province</label>
      <select
        name="departmentId"
        type="text"
        class="form-control"
      >
        <option>Batangas</option>
        <option>Option 2</option>
        <option>Option 3</option>
      </select>
    </div>
    <div class="form-group col-4">
      <label class="form-label" for="departmentId">City/Municipality</label>
      <select
        name="departmentId"
        type="text"
        class="form-control"
      >
        <option>Batangas City</option>
        <option>Option 2</option>
        <option>Option 3</option>
      </select>
    </div>
    <div class="form-group col-4">
      <label class="form-label" for="departmentId">Barangay</label>
      <select
        name="departmentId"
        type="text"
        class="form-control"
      >
        <option>Poblacion</option>
        <option>Option 2</option>
        <option>Option 3</option>
      </select>
    </div>
  </div>
  <div class="row d-flex justify-content-start align-items-center">
    <div class="form-group col-4">
      <label class="form-label" for="departmentId">Street/House No.</label>
      <input name="departmentId" type="text" value="023" class="form-control" />
    </div>
    <div class="form-group col-4">
      <label class="form-label" for="departmentId">Zip Code</label>
      <input
        name="departmentId"
        type="text"
        value="4200"
        class="form-control"
      />
    </div>
  </div>
  <hr class="custom-hr" />
  <div class="row d-flex justify-content-start align-items-center">
    <div class="form-group col-4">
      <label class="form-label" for="departmentId">SSS Number</label>
      <input name="departmentId" type="text" class="form-control" />
    </div>
    <div class="form-group col-4">
      <label class="form-label" for="departmentId">PhilHealth Number</label>
      <input name="departmentId" type="text" class="form-control" />
    </div>
    <div class="form-group col-4">
      <label class="form-label" for="departmentId">Pag-Ibig Number</label>
      <input name="departmentId" type="text" class="form-control" />
    </div>
  </div>
  <div class="row d-flex justify-content-start align-items-center">
    <div class="form-group col-4">
      <label class="form-label" for="departmentId">TIN Number</label>
      <input name="departmentId" type="text" class="form-control" />
    </div>
  </div>
  <hr class="custom-hr" />
  <div class="row d-flex justify-content-start align-items-center">
    <div class="form-group col-4">
      <label class="form-label" for="departmentId">Remarks</label>
      <input name="departmentId" type="text" class="form-control" />
    </div>
    <div class="form-group col-4">
      <div class="custom-control custom-control-primary custom-switch">
        <span class="mr-1">Is Current Employee? </span>
        <input
          type="checkbox"
          class="custom-control-input"
          id="isSidcEmployee"
          name="isSidcEmployee"
        />
        <label class="custom-control-label" for="isSidcEmployee"></label>
      </div>
    </div>
  </div>
</form>
