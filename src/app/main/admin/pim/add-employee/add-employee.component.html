<div class="content-wrapper container-xxl p-0">
  <div class="content-body">
    <app-content-header [contentHeader]="contentHeader"></app-content-header>

    <section id="pim-page">
      <div class="card" style="padding-bottom: 10px">
        <div class="d-flex mt-1 justify-content-between">
          <div class="col-6 ml-1 align-items-center d-flex">
            <h4 style="margin: 0">Add New Employee</h4>
          </div>
        </div>
        <hr class="custom-hr" />
        <form [formGroup]="filterPIMForm">
          <div class="col-12" style="padding: 30px">
            <div class="d-flex flex-wrap align-items-start">
                <div style="width: 30%;">
                    
              <div
              style="position: relative; "
              class="justify-content-center d-flex"
            >
              <img
                style="
                  border-radius: 50%;
                  border: 5px solid white;
                  box-shadow: 0px 0px 10px 1px rgb(193, 193, 193);
                "
                width="40%"
                src="../../../../../assets/images/avatars/default-avatar.png"
              />
              <!-- Badge positioned on top of the image -->
              <span
                rippleEffect
                style="
                  position: absolute;
                  bottom: 0px;
                  right: 30%;
                  background-color: #24695c;
                  color: white;
                  padding: 10px;
                  cursor: pointer;
                  width: 40px; /* Add a fixed width */
                  height: 40px; /* Add a fixed height */
                  border-radius: 50%;
                  font-size: 20px;
                  display: flex;
                  justify-content: center; /* Centers the + */
                  align-items: center; /* Centers the + */
                "
              >
                +
              </span>
            </div>
            <div style="text-align: center;" class="mt-1">
                
                <span>
                    Accepts jpg, .png, .gif up to 1MB. Recommended dimensions: 200px X 200px
                </span>
            </div>
                </div>
              <div style="width: 70%">
                <div
                  class="row justify-content-start d-flex align-items-center"
                >
                  <div class="form-group col-4">
                    <label class="form-label" for="departmentId"
                      >First Name *</label
                    >
                    <input
                      name="departmentId"
                      type="text"
                      class="form-control"
                    />
                  </div>
                  <div class="form-group col-4">
                    <label class="form-label" for="departmentId"
                      >Middle Name</label
                    >
                    <input
                      name="departmentId"
                      type="text"
                      class="form-control"
                    />
                  </div>
                  <div class="form-group col-4">
                    <label class="form-label" for="departmentId"
                      >Last Name *</label
                    >
                    <input
                      name="departmentId"
                      type="text"
                      class="form-control"
                    />
                  </div>
                </div>
                <div
                  class="row d-flex justify-content-start align-items-center"
                >
                  <div class="form-group col-4">
                    <label class="form-label" for="departmentId"
                      >Suffix Name</label
                    >
                    <select
                      name="departmentId"
                      type="text"
                      formControlName="departmentId"
                      class="form-control"
                    >
                      <option>Option 1</option>
                      <option>Option 2</option>
                      <option>Option 3</option>
                    </select>
                  </div>
                  <div class="form-group col-4">
                    <label class="form-label" for="departmentId"
                      >Employee Code *</label
                    >
                    <input
                      name="departmentId"
                      type="text"
                      class="form-control"
                    />
                  </div>
                </div>
                <hr class="custom-hr" />
                <div>
                  <div
                    class="custom-control custom-control-primary custom-switch"
                  >
                    <span class="mr-1">Create Login Details</span>
                    <input
                      type="checkbox"
                      class="custom-control-input"
                      id="isSidcEmployee"
                      name="isSidcEmployee"
                    />
                    <label
                      class="custom-control-label"
                      for="isSidcEmployee"
                    ></label>
                  </div>
                </div>

                <div class="row mt-1">
                  <div class="form-group col-6">
                    <label class="form-label" for="departmentId"
                      >Username *</label
                    >
                    <input
                      name="departmentId"
                      type="text"
                      class="form-control"
                    />
                  </div>
                  <div class="form-group col-6">
                    <label class="form-label" for="departmentId"
                      >Password *</label
                    >
                    <input
                      name="departmentId"
                      type="text"
                      class="form-control"
                    />
                  </div>
                  <div class="form-group col-6">
                    <label class="form-label" for="departmentId"
                      >Confirm Password *</label
                    >
                    <input
                      name="departmentId"
                      type="text"
                      class="form-control"
                    />
                  </div>
                  <div class="form-group col-6  d-flex align-items-center">
                    <div
                    class="custom-control custom-control-primary custom-switch"
                  >
                  <span class="mr-1">Enabled</span>
                    <input type="checkbox" class="custom-control-input" id="enabled" name="enabled" />
                    <label class="custom-control-label" for="enabled"></label>
                  </div>
                  </div>
                </div>
              </div>
            </div>
            <hr class="custom-hr" />
            <div class="d-flex justify-content-between">
              <div>
                <span>* Required</span>
              </div>

              <div>
                <button
                  style="border: 1px solid #24695c; color: #24695c"
                  class="btn mr-50"
                >
                  Cancel
                </button>
                <button class="btn btn-primary">Submit</button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </section>
  </div>
</div>
